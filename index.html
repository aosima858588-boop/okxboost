<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>H 代币计算器 - 手机版</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(180deg, #0a0e1f, #1a1f3a);
            color: #e8e8ff;
            margin: 0;
            padding: 12px;
            min-height: 100vh;
            touch-action: manipulation;
        }
        .container {
            background: rgba(25, 25, 60, 0.88);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(100,120,255,0.25);
        }
        h1 {
            font-size: 1.6em;
            text-align: center;
            color: #b0d0ff;
            margin: 12px 0 20px;
        }
        h2 {
            font-size: 1.3em;
            color: #a0c0ff;
            margin: 20px 0 10px;
        }
        .status-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 15px 0;
        }
        .status-card {
            background: rgba(35,35,80,0.7);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #5050a0;
        }
        .status-card small {
            display: block;
            font-size: 0.8em;
            color: #b0b0ff;
            margin-bottom: 4px;
        }
        .value {
            font-size: 1.15em;
            font-weight: 600;
            color: #90ffaa;
        }
        .health-good  { color: #80ff80; }
        .health-mid   { color: #ffcc66; }
        .health-bad   { color: #ff8080; }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #6060c0;
            background: rgba(40,40,90,0.6);
            color: white;
            font-size: 1.1em;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #5a7bff, #8a6fff);
            color: white;
            font-size: 1.15em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
        #result {
            margin-top: 16px;
            padding: 14px;
            background: rgba(20,50,30,0.5);
            border-radius: 10px;
            border-left: 4px solid #60c080;
            font-size: 0.95em;
            line-height: 1.5;
        }
        .sustainable   { color: #90ff90; font-weight: bold; }
        .unsustainable { color: #ff9090; font-weight: bold; }
        footer {
            text-align: center;
            font-size: 0.8em;
            color: #a0a0d0;
            margin-top: 30px;
        }
        @media (min-width: 500px) {
            .container { max-width: 420px; margin: 20px auto; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>H 代币经济模型计算器</h1>

    <div class="section">
        <h2>当前状态</h2>
        <div class="status-grid" id="status">
            <div class="status-card">
                <small>当前价格</small>
                <div class="value" id="price">0.006342 U/H</div>
            </div>
            <div class="status-card">
                <small>LP USDT</small>
                <div class="value" id="lpU">110,000</div>
            </div>
            <div class="status-card">
                <small>奖励池剩余</small>
                <div class="value" id="pool">300,000,000 H</div>
            </div>
            <div class="status-card">
                <small>国库 (U)</small>
                <div class="value" id="treasury">0 USDT</div>
            </div>
            <div class="status-card">
                <small>可持续天数</small>
                <div class="value" id="daysLeft">—</div>
            </div>
            <div class="status-card">
                <small>健康度</small>
                <div class="value" id="health">—</div>
            </div>
        </div>
    </div>

    <div class="section">
        <h2>模拟买入 + 质押</h2>
        
        <label>买入 USDT 金额</label>
        <input type="number" id="usdtIn" value="3000" step="100" min="0">

        <label>锁定期天数</label>
        <input type="number" id="days" value="30" min="1" max="365">

        <button onclick="simulate()">执行模拟</button>

        <div id="result"></div>
    </div>

    <footer>
        税率：5% USDT本位（进入国库）<br>
        总供应 10亿 H | 奖励池初始 3亿 H<br>
        手机版优化 • 数据仅供模拟参考
    </footer>
</div>

<script>
// 全局状态（U本位税）
let lp_h = 17351598;
let lp_u = 110000;
let k = lp_h * lp_u;
let treasury_u = 0;           // 国库改为 USDT
let staking_pool = 300000000;
const total_supply = 1000000000;
let lastDailyReward = 0;      // 用于估算可持续天数

function getDailyRate(days) {
    if (days <= 7) return 0.005;
    if (days <= 16) return 0.006;
    if (days <= 30) return 0.007;
    if (days <= 60) return 0.008;
    return 0.01;
}

function getHealthScore(poolLeft) {
    const poolPct = poolLeft / 300000000;
    const treasuryScore = Math.min(treasury_u / 10000, 1); // 假设1万U为满分参考
    let score = (poolPct * 70) + (treasuryScore * 20) + 10; // 基础10分
    score = Math.min(100, Math.max(0, Math.round(score)));
    return score;
}

function updateStatus() {
    const price = (lp_u / lp_h).toFixed(6);
    const poolPct = (staking_pool / 300000000 * 100).toFixed(1);
    const daysLeft = lastDailyReward > 0 ? Math.floor(staking_pool / lastDailyReward) : "—";
    const health = getHealthScore(staking_pool);
    let healthClass = health >= 80 ? "health-good" : health >= 50 ? "health-mid" : "health-bad";

    document.getElementById('price').textContent = price + " U/H";
    document.getElementById('lpU').textContent = Math.round(lp_u).toLocaleString();
    document.getElementById('pool').textContent = Math.round(staking_pool).toLocaleString() + ` (${poolPct}%)`;
    document.getElementById('treasury').textContent = Math.round(treasury_u).toLocaleString() + " USDT";
    document.getElementById('daysLeft').textContent = daysLeft + (daysLeft === "—" ? "" : " 天");
    document.getElementById('health').textContent = health + " / 100";
    document.getElementById('health').className = "value " + healthClass;
}

function simulate() {
    let usdtIn = parseFloat(document.getElementById('usdtIn').value) || 0;
    const days = parseInt(document.getElementById('days').value) || 1;

    if (usdtIn <= 0 || days < 1) {
        document.getElementById('result').innerHTML = "<span style='color:#ffaa80'>请输入有效金额和天数</span>";
        return;
    }

    // 5% USDT本位税
    const tax_u = usdtIn * 0.05;
    const usdtAfterTax = usdtIn * 0.95;
    treasury_u += tax_u;

    // Uniswap 买入（税后 USDT 进入池子）
    const new_u = lp_u + usdtAfterTax;
    const new_h = k / new_u;
    const h_received = lp_h - new_h;

    // 更新池子
    lp_h = new_h;
    lp_u = new_u;
    k = lp_h * lp_u;

    // 质押 & 奖励
    const stake_amount = h_received;
    const rate = getDailyRate(days);
    const total_reward = stake_amount * rate * days;
    const dailyRewardEst = total_reward / days;   // 本次日均奖励
    lastDailyReward = dailyRewardEst;             // 用于估算可持续天数（可优化为移动平均）

    let poolAfter = staking_pool - total_reward;
    let sustainable = poolAfter >= 0 
        ? `<span class="sustainable">✅ 可持续</span>`
        : `<span class="unsustainable">❌ 不可持续（缺口 ${Math.abs(poolAfter).toLocaleString()} H）</span>`;

    staking_pool = Math.max(0, poolAfter);

    const priceNew = (lp_u / lp_h).toFixed(6);

    // 结果展示
    let html = `
        <strong>模拟结果：</strong><br><br>
        买入 <strong>${usdtIn.toLocaleString()} USDT</strong><br>
        → 税后进入池子 <strong>${usdtAfterTax.toLocaleString(0)} USDT</strong><br>
        → 税金 <strong>${tax_u.toLocaleString(0)} USDT</strong>（国库）<br>
        获得 H <strong>${h_received.toLocaleString(0)}</strong><br>
        新价格 <strong>${priceNew} U/H</strong><br><br>

        质押 <strong>${stake_amount.toLocaleString(0)} H</strong> × ${days} 天<br>
        日收益 <strong>${(rate*100).toFixed(1)}%</strong> → 总奖励 <strong>${total_reward.toLocaleString(0)} H</strong><br><br>

        剩余奖励池 <strong>${staking_pool.toLocaleString(0)} H</strong><br>
        国库 <strong>${treasury_u.toLocaleString(0)} USDT</strong><br><br>

        ${sustainable}
    `;

    document.getElementById('result').innerHTML = html;
    updateStatus();
}

// 初始化
updateStatus();
</script>
</body>
</html>
