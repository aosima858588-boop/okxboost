<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>H 代币计算器 - 手机版</title>
    <style>
        @keyframes liquidFlow {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(-45deg, #0c0920, #19143e, #251f58, #1a1935);
            background-size: 280% 280%;
            animation: liquidFlow 28s ease infinite;
            color: #f0f4ff;
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }
        .container {
            background: rgba(30, 30, 70, 0.22);
            backdrop-filter: blur(32px) saturate(170%);
            border-radius: 24px;
            padding: 16px 12px;
            box-shadow: 0 8px 36px rgba(0,0,0,0.48),
                        inset 0 1px 0 rgba(255,255,255,0.06);
            border: 1px solid rgba(180,200,255,0.09);
        }
        h1 { font-size: 1.5em; text-align: center; margin: 6px 0 18px; color: #d8e0ff; text-shadow: 0 1px 8px rgba(60,100,255,0.3); }
        h2 { font-size: 1.18em; color: #c0d0ff; margin: 18px 0 8px; font-weight: 500; }
        .status-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 10px 0 18px; }
        .status-card {
            background: rgba(50,50,90,0.26);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 12px 8px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.07);
        }
        .status-card small { font-size: 0.74em; color: #b0c0ff; display: block; margin-bottom: 4px; }
        .value { font-size: 1.05em; font-weight: 600; color: #b0ffe8; }
        .health-good  { color: #90ffb0; }
        .health-mid   { color: #ffddaa; }
        .health-bad   { color: #ffaa90; }
        input {
            width: 100%;
            padding: 14px;
            margin: 6px 0;
            border-radius: 14px;
            border: 1px solid rgba(110,130,255,0.2);
            background: rgba(45,45,85,0.32);
            color: white;
            font-size: 1.02em;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 16px;
            margin: 10px 0 6px;
            border: none;
            border-radius: 16px;
            font-size: 1.08em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.24s;
            backdrop-filter: blur(10px);
        }
        #btnBuy  { background: linear-gradient(135deg, #5a8aff, #7b6eff); color: white; }
        #btnSell { background: linear-gradient(135deg, #ff708f, #ff92b0); color: white; }
        #btnMonth{ background: linear-gradient(135deg, #00d9c0, #1fffe8); color: #001f20; }
        #btnReset{ background: linear-gradient(135deg, #6a7eff, #8b70ff); color: white; margin-top: 20px; }
        button:active { transform: scale(0.97); box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
        #result {
            margin: 14px 0;
            padding: 14px;
            background: rgba(20,40,35,0.32);
            backdrop-filter: blur(18px);
            border-radius: 16px;
            border: 1px solid rgba(100,220,180,0.11);
            font-size: 0.93em;
            line-height: 1.5;
            min-height: 100px;
        }
        .sustainable   { color: #b0ffc0; font-weight: bold; }
        .unsustainable { color: #ffc0b0; font-weight: bold; }
        .my-hold       { color: #ffe080; font-weight: bold; }
        footer { text-align: center; font-size: 0.78em; color: #a0b0e0; margin-top: 28px; opacity: 0.85; }
    </style>
</head>
<body>

<div class="container">
    <h1>H 代币计算器</h1>

    <div class="section">
        <h2>当前状态</h2>
        <div class="status-grid" id="status">
            <div class="status-card"><small>当前价格</small><div class="value" id="price">0.006342 U/H</div></div>
            <div class="status-card"><small>LP USDT</small><div class="value" id="lpU">110,000</div></div>
            <div class="status-card"><small>奖励池</small><div class="value" id="pool">300,000,000 H</div></div>
            <div class="status-card"><small>国库</small><div class="value" id="treasury">0 USDT</div></div>
            <div class="status-card"><small>社区地址</small><div class="value" id="communityU">0 USDT</div></div>
            <div class="status-card"><small>可持续天数</small><div class="value" id="daysLeft">—</div></div>
            <div class="status-card"><small>健康度</small><div class="value" id="health">—</div></div>
            <div class="status-card" style="grid-column: span 2;">
                <small>我的持仓 H</small>
                <div class="value my-hold" id="myHold">0 H</div>
            </div>
        </div>
    </div>

    <div class="section">
        <h2>买入 + 质押</h2>
        <input type="number" id="usdtIn" value="3000" step="100" min="0" placeholder="USDT 金额">
        <input type="number" id="days" value="30" min="1" max="365" placeholder="天数">
        <button id="btnBuy" onclick="simulateBuy()">买入 + 质押</button>
    </div>

    <div class="section">
        <h2>卖出</h2>
        <input type="number" id="hSell" value="1000000" step="10000" min="0" placeholder="卖出 H 数量">
        <button id="btnSell" onclick="simulateSell()">执行卖出</button>
    </div>

    <div class="section">
        <h2>月结算</h2>
        <button id="btnMonth" onclick="monthlySettlement()">执行月结算</button>
    </div>

    <div id="result"></div>

    <button id="btnReset" onclick="resetAll()">重置全部</button>

    <footer>
        5%税 + 0.34%交易量收入 → 国库<br>
        月结算：70% → 社区 → 10%分红<br>
        先买才能卖 • 模拟参考
    </footer>
</div>

<script>
// 完整逻辑
const INITIAL = {
    lp_h: 17351598,
    lp_u: 110000,
    k: 17351598 * 110000,
    treasury_u: 0,
    community_u: 0,
    staking_pool: 300000000,
    lastDailyReward: 0,
    my_hold_h: 0
};

let lp_h = INITIAL.lp_h;
let lp_u = INITIAL.lp_u;
let k = INITIAL.k;
let treasury_u = INITIAL.treasury_u;
let community_u = INITIAL.community_u;
let staking_pool = INITIAL.staking_pool;
let lastDailyReward = INITIAL.lastDailyReward;
let my_hold_h = INITIAL.my_hold_h;

function getDailyRate(days) {
    if (days <= 7) return 0.005;
    if (days <= 16) return 0.006;
    if (days <= 30) return 0.007;
    if (days <= 60) return 0.008;
    return 0.01;
}

function getHealthScore() {
    const poolPct = staking_pool / 300000000;
    const treasuryScore = Math.min(treasury_u / 10000, 1);
    const communityScore = Math.min(community_u / 10000, 1);
    let score = (poolPct * 60) + (treasuryScore * 15) + (communityScore * 15) + 10;
    return Math.min(100, Math.max(0, Math.round(score)));
}

function updateStatus() {
    const price = lp_h > 0 ? (lp_u / lp_h).toFixed(6) : "—";
    const poolPct = (staking_pool / 300000000 * 100).toFixed(1);
    const daysLeft = lastDailyReward > 0 ? Math.floor(staking_pool / lastDailyReward) : "—";
    const health = getHealthScore();
    let healthClass = health >= 80 ? "health-good" : health >= 50 ? "health-mid" : "health-bad";

    document.getElementById('price').textContent = price + " U/H";
    document.getElementById('lpU').textContent = Math.round(lp_u).toLocaleString();
    document.getElementById('pool').textContent = Math.round(staking_pool).toLocaleString();
    document.getElementById('treasury').textContent = Math.round(treasury_u).toLocaleString() + " USDT";
    document.getElementById('communityU').textContent = Math.round(community_u).toLocaleString() + " USDT";
    document.getElementById('daysLeft').textContent = daysLeft + (daysLeft === "—" ? "" : "天");
    document.getElementById('health').textContent = health + " / 100";
    document.getElementById('health').className = "value " + healthClass;
    document.getElementById('myHold').textContent = my_hold_h.toLocaleString(0) + " H";
}

function addToTreasury(volume) {
    treasury_u += volume * 0.0034;
}

function simulateBuy() {
    const resultDiv = document.getElementById('result');
    let usdtIn = parseFloat(document.getElementById('usdtIn').value) || 0;
    const days = parseInt(document.getElementById('days').value) || 1;

    if (usdtIn <= 0 || days < 1) {
        resultDiv.innerHTML = "<span style='color:#ffdd88'>请输入有效金额和天数</span>";
        return;
    }

    const tax_u = usdtIn * 0.05;
    const usdtAfterTax = usdtIn * 0.95;
    treasury_u += tax_u;
    addToTreasury(usdtIn);

    const new_u = lp_u + usdtAfterTax;
    const new_h = k / new_u;
    const h_received = lp_h - new_h;

    if (h_received <= 0) {
        resultDiv.innerHTML = "<span style='color:#ffaa90'>买入金额过大，无法获得 H</span>";
        return;
    }

    lp_h = new_h;
    lp_u = new_u;
    k = lp_h * lp_u;
    my_hold_h += h_received;

    const stake_amount = h_received;
    const rate = getDailyRate(days);
    const total_reward = stake_amount * rate * days;
    lastDailyReward = total_reward / days;

    let poolAfter = staking_pool - total_reward;
    let sustainable = poolAfter >= 0 
        ? `<span class="sustainable">可持续</span>`
        : `<span class="unsustainable">不可持续（缺口 ${Math.abs(poolAfter).toLocaleString()} H）</span>`;
    staking_pool = Math.max(0, poolAfter);

    const priceNew = (lp_u / lp_h).toFixed(6);

    resultDiv.innerHTML = `
        <strong>买入 + 质押</strong><br><br>
        交易量 ${usdtIn.toLocaleString()} USDT<br>
        → 税5% ${tax_u.toLocaleString(0)} + 0.34% ${(usdtIn*0.0034).toFixed(0)}<br>
        获得 ${h_received.toLocaleString(0)} H<br>
        我的持仓 → <span class="my-hold">${my_hold_h.toLocaleString(0)} H</span><br>
        新价格 ${priceNew} U/H<br><br>
        奖励 ${total_reward.toLocaleString(0)} H<br>
        剩余奖励池 ${staking_pool.toLocaleString(0)} H<br><br>
        ${sustainable}
    `;
    updateStatus();
}

function simulateSell() {
    const resultDiv = document.getElementById('result');
    let hSell = parseFloat(document.getElementById('hSell').value) || 0;

    if (hSell <= 0) {
        resultDiv.innerHTML = "<span style='color:#ffdd88'>请输入卖出数量</span>";
        return;
    }
    if (hSell > my_hold_h) {
        resultDiv.innerHTML = `<span style='color:#ffdd88'>持仓不足，仅有 ${my_hold_h.toLocaleString(0)} H</span>`;
        return;
    }

    const new_h = lp_h + hSell;
    const new_u = k / new_h;
    const u_out = lp_u - new_u;

    const tax_u = u_out * 0.05;
    const u_received = u_out * 0.95;
    treasury_u += tax_u;
    addToTreasury(u_out);

    lp_h = new_h;
    lp_u = new_u;
    k = lp_h * lp_u;
    my_hold_h -= hSell;

    const priceNew = (lp_u / lp_h).toFixed(6);

    resultDiv.innerHTML = `
        <strong>卖出完成</strong><br><br>
        卖出 ${hSell.toLocaleString(0)} H<br>
        获得（税前）${u_out.toLocaleString(0)} USDT<br>
        → 税5% ${tax_u.toLocaleString(0)} + 0.34% ${(u_out*0.0034).toFixed(0)}<br>
        实际到手 ${u_received.toLocaleString(0)} USDT<br>
        新价格 ${priceNew} U/H<br><br>
        我的持仓 → <span class="my-hold">${my_hold_h.toLocaleString(0)} H</span>
    `;
    updateStatus();
}

function monthlySettlement() {
    const resultDiv = document.getElementById('result');
    if (treasury_u <= 0) {
        resultDiv.innerHTML = "<span style='color:#ffdd88'>国库无余额可结算</span>";
        return;
    }

    const transferred = treasury_u * 0.7;
    community_u += transferred;
    treasury_u *= 0.3;

    const dividend_pool = community_u * 0.10;
    community_u -= dividend_pool;

    resultDiv.innerHTML = `
        <strong>月结算完成</strong><br><br>
        国库 → 社区地址：${transferred.toLocaleString(0)} USDT<br>
        社区地址当前：${community_u.toLocaleString(0)} USDT<br>
        本月分红池（10%）：${dividend_pool.toLocaleString(0)} USDT<br>
        （按 10万分红币比例发放）
    `;
    updateStatus();
}

function resetAll() {
    lp_h = INITIAL.lp_h;
    lp_u = INITIAL.lp_u;
    k = INITIAL.k;
    treasury_u = INITIAL.treasury_u;
    community_u = INITIAL.community_u;
    staking_pool = INITIAL.staking_pool;
    lastDailyReward = INITIAL.lastDailyReward;
    my_hold_h = INITIAL.my_hold_h;

    document.getElementById('result').innerHTML = "<span style='color:#c0d0ff'>已重置到初始状态</span>";
    updateStatus();
}

// 初始化
updateStatus();
</script>
</body>
</html>
